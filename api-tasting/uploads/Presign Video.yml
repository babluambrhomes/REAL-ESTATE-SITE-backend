info:
  name: Presign Video
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}api/v1/uploads/video/presign"
  body:
    type: json
    data: |-
      {
          "name":  "property-tour.mp4",
          "size":  10485760,
          "length":  30,
          "entityType":  "PROPERTY"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
