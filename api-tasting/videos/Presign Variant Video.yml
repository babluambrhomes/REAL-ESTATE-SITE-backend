info:
  name: Presign Variant Video
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}api/v1/videos/presign"
  body:
    type: json
    data: |-
      {
          "name":  "variant-tour.mp4",
          "size":  10485760,
          "length":  30,
          "propertyId":  "{{propertyId}}",
          "variantId":  "{{variantId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
