info:
  name: Presign Seller Video
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}api/v1/videos/presign"
  body:
    type: json
    data: |-
      {
          "name":  "seller-intro.mp4",
          "size":  10485760,
          "length":  30,
          "sellerId":  "{{sellerId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
