info:
  name: Delete Video
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{base_url}}api/v1/videos/{{videoId}}"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
