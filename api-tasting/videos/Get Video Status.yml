info:
  name: Get Video Status
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}api/v1/videos/{{videoId}}/status"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
