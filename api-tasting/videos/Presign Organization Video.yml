info:
  name: Presign Organization Video
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}api/v1/videos/presign"
  body:
    type: json
    data: |-
      {
          "name":  "organization-intro.mp4",
          "size":  10485760,
          "length":  30,
          "organizationId":  "{{organizationId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
