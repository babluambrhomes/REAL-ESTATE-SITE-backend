info:
  name: Get Seller Question
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}api/v1/buyer-questions/seller/{{questionId}}"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
