info:
  name: Delete KYC Document
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{base_url}}api/v1/sellers/kyc/documents/{{docId}}"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
