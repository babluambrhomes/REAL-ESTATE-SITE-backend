info:
  name: Get KYC Document File
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}api/v1/sellers/kyc/documents/{{docId}}/file"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
