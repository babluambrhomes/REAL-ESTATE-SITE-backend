info:
  name: List Members
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}api/v1/organizations/{{organizationId}}/members?page=1&limit=10"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
