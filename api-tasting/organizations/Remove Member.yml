info:
  name: Remove Member
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{base_url}}api/v1/organizations/{{organizationId}}/members/{{memberId}}"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
