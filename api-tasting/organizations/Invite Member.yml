info:
  name: Invite Member
  type: http
  seq: 12

http:
  method: POST
  url: "{{base_url}}api/v1/organizations/{{organizationId}}/invitations"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
          "email":  "priya.verma@example.com",
          "phone":  "9876501234",
          "roleId":  "{{roleId}}",
          "expiresInHours":  72
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
