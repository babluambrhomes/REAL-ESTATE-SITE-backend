info:
  name: List Invitations
  type: http
  seq: 11

http:
  method: GET
  url: "{{base_url}}api/v1/organizations/{{organizationId}}/invitations"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
