info:
  name: Upload Category Image
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}api/v1/seller-categories/{{categoryId}}/image"
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        value: []
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
