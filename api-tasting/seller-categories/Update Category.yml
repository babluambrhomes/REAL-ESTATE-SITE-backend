info:
  name: Update Category
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}api/v1/seller-categories/{{categoryId}}"
  body:
    type: json
    data: |-
      {
          "name":  "Property Consultancy",
          "description":  "Updated description",
          "isActive":  true
      }
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
