info:
  name: List Categories
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}api/v1/seller-categories"
  headers:
    - name: Authorization
      value: Bearer {{adminAccessToken}}
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
