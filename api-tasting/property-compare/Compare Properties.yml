info:
  name: Compare Properties
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}api/v1/properties/compare"
  body:
    type: json
    data: |
      {
        "properties": [
          {
            "propertyId": "{{propertyId}}",
            "variantId": "{{variantId}}"
          }
        ]
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
