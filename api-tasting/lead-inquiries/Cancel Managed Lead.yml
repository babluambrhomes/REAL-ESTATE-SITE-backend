info:
  name: Cancel Managed Lead
  type: http
  seq: 15

http:
  method: PATCH
  url: "{{base_url}}api/v1/lead-inquiries/manage/{{leadInquiryId}}/cancel"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: json
    data: |-
      {
          "reason":  "Buyer cancelled."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
