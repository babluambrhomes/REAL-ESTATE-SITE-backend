info:
  name: Create Site Visit
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}api/v1/lead-inquiries/site-visit"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
          "propertyId":  "{{propertyId}}",
          "source":  "CONTACT",
          "name":  "Amit Patel",
          "email":  "amit.patel@example.com",
          "phone":  "9812345678",
          "userAddress":  "A-101, Palm Grove, Andheri",
          "visitDate":  "2030-01-15",
          "startTime":  "2030-01-15T10:00:00.000Z",
          "endTime":  "2030-01-15T11:00:00.000Z"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
