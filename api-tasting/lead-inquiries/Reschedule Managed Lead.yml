info:
  name: Reschedule Managed Lead
  type: http
  seq: 14

http:
  method: PATCH
  url: "{{base_url}}api/v1/lead-inquiries/manage/{{leadInquiryId}}/reschedule"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: json
    data: |-
      {
          "visitDate":  "2026-12-22",
          "startTime":  "2026-12-22T10:00:00.000Z",
          "endTime":  "2026-12-22T11:00:00.000Z",
          "comment":  "Rescheduled by seller."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
