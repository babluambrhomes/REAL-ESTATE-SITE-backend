info:
  name: Reschedule My Lead Inquiry
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{base_url}}api/v1/lead-inquiries/me/{{leadInquiryId}}/reschedule"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
          "visitDate":  "2030-01-15",
          "startTime":  "2030-01-15T10:00:00.000Z",
          "endTime":  "2030-01-15T11:00:00.000Z",
          "comment":  "Please reschedule to next week."
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
