info:
  name: Cancel My Lead Inquiry
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{base_url}}api/v1/lead-inquiries/me/{{leadInquiryId}}/cancel"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
          "reason":  "Plans changed."
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
