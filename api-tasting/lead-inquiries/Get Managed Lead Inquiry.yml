info:
  name: Get Managed Lead Inquiry
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}api/v1/lead-inquiries/manage/{{leadInquiryId}}"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
