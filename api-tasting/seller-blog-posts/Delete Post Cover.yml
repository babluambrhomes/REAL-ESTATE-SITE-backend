info:
  name: Delete Post Cover
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{base_url}}api/v1/sellers/me/blog-posts/{{blogPostId}}/cover"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
