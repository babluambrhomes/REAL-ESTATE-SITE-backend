info:
  name: Upload Post Cover
  type: http
  seq: 7

http:
  method: PUT
  url: "{{base_url}}api/v1/sellers/me/blog-posts/{{blogPostId}}/cover"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: multipart-form
    data:
      - name: cover
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
