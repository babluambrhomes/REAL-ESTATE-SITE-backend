info:
  name: Change Post Status
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}api/v1/sellers/me/blog-posts/{{blogPostId}}/status"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: json
    data: |-
      {
          "status":  "PUBLISHED"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
