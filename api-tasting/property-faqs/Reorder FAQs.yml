info:
  name: Reorder FAQs
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{base_url}}api/v1/property-faqs/reorder"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: json
    data: |-
      {
          "propertyId":  "{{propertyId}}",
          "faqs":  [
                       {
                           "id":  "{{faqId}}",
                           "displayOrder":  1
                       }
                   ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
