info:
  name: List FAQs
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}api/v1/property-faqs?propertyId={{propertyId}}"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
