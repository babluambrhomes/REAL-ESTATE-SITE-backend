info:
  name: Get User By Id Admin
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}api/v1/users/{{userId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminAccessToken}}
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
