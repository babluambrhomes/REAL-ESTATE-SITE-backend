info:
  name: Update Avatar
  type: http
  seq: 3

http:
  method: PUT
  url: "{{base_url}}api/v1/users/profile/avatar"
  body:
    type: multipart-form
    data:
      - name: avatar
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
