info:
  name: List My FAQs
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}api/v1/sellers/me/faqs"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
