info:
  name: Update FAQ
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}api/v1/sellers/me/faqs/{{faqId}}"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: json
    data: |-
      {
          "answer":  "Yes, 1 percent brokerage applies.",
          "isActive":  true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
