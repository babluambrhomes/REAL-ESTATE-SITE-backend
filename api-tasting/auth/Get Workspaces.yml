info:
  name: Get Workspaces
  type: http
  seq: 15

http:
  method: GET
  url: "{{base_url}}api/v1/auth/workspaces"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
