info:
  name: Register with phone
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}api/v1/auth/register"
  body:
    type: json
    data: |-
      {
          "phone":  "9876543210",
          "firstName":  "Rahul"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
