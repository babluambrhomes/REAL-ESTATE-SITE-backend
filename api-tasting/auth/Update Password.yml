info:
  name: Update Password
  type: http
  seq: 13

http:
  method: PATCH
  url: "{{base_url}}api/v1/auth/me/password"
  body:
    type: json
    data: |-
      {
          "currentPassword":  "Test@1234",
          "newPassword":  "NewTest@1234"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
