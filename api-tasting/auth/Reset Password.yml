info:
  name: Reset Password
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}api/v1/auth/reset-password"
  body:
    type: json
    data: |-
      {
          "token":  "{{resetToken}}",
          "newPassword":  "NewTest@1234"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
