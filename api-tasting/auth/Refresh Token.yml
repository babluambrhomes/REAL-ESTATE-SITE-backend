info:
  name: Refresh Token
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}api/v1/auth/refresh"
  body:
    type: json
    data: |-
      {
          "refreshToken":  "{{refreshToken}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
