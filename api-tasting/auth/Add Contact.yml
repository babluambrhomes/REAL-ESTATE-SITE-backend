info:
  name: Add Contact
  type: http
  seq: 12

http:
  method: PATCH
  url: "{{base_url}}api/v1/auth/me/contact"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
          "phone":  "9876543210"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
