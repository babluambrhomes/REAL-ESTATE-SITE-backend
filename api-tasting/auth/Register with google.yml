info:
  name: Register with google
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}api/v1/auth/register"
  body:
    type: json
    data: |-
      {
          "FbTokenId":  "9876543210"  
      }

runtime:
  variables:
    - name: base_url
      value: http://localhost:5000/

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
