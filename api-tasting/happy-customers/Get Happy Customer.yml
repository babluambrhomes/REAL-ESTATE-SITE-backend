info:
  name: Get Happy Customer
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}api/v1/happy-customers/{{happyCustomerId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminAccessToken}}
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
