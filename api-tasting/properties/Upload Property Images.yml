info:
  name: Upload Property Images
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}api/v1/properties/{{propertyId}}/images"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: multipart-form
    data:
      - name: images
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
