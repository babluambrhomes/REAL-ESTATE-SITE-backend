info:
  name: Update Property Status
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{base_url}}api/v1/properties/{{propertyId}}/status"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: json
    data: |-
      {
          "propertyStatus":  "UNDER_OFFER"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
