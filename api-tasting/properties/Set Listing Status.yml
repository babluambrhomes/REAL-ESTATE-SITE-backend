info:
  name: Set Listing Status
  type: http
  seq: 18

http:
  method: PATCH
  url: "{{base_url}}api/v1/properties/{{propertyId}}/listing-status"
  headers:
    - name: Authorization
      value: Bearer {{adminAccessToken}}
  body:
    type: json
    data: |-
      {
          "listingStatus":  "PUBLISHED"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
