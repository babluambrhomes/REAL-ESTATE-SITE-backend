info:
  name: Delete Property
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{base_url}}api/v1/properties/{{propertyId}}"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
