info:
  name: My Properties
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}api/v1/properties/my?page=1&limit=10"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
