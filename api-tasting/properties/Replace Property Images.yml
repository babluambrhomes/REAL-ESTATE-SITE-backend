info:
  name: Replace Property Images
  type: http
  seq: 9

http:
  method: PUT
  url: "{{base_url}}api/v1/properties/{{propertyId}}/images"
  headers:
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: json
    data: |-
      {
          "images":  [
                         {
                             "url":  "https://example.com/property-1.jpg",
                             "isFeatured":  true
                         },
                         {
                             "url":  "https://example.com/property-2.jpg",
                             "isFeatured":  false
                         }
                     ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
